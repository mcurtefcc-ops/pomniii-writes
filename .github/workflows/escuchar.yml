name: Escuchar al bot

# Atiende las ordenes que le mandas al bot de Telegram:
#
#   /post     publica ahora el siguiente texto
#   /probar   te manda la tarjeta sin publicar nada
#   /saltar   descarta el siguiente sin publicarlo
#   /estado   cuantos textos quedan
#
# Va por sondeo cada 5 minutos, que es el intervalo minimo que permite el cron
# de GitHub. Eso significa que entre que escribes /post y que sale el post
# pueden pasar unos minutos: Actions ademas retrasa las tareas programadas
# cuando hay cola. No se pierde ninguna orden, porque Telegram las guarda en una
# cola hasta que alguien las recoge; solo tardan un rato en atenderse.
#
# Si algun dia quieres respuesta instantanea, hace falta un webhook, y eso pide
# un servicio con URL publica siempre encendido (un Cloudflare Worker gratuito,
# por ejemplo). Con sondeo no hay nada que mantener.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# El mismo grupo que la publicacion diaria: los dos escriben en data/ y si
# coinciden se pisan el estado.
concurrency:
  group: pomniii-estado
  cancel-in-progress: false

jobs:
  escuchar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atender las ordenes
        env:
          IG_MODO: ${{ vars.IG_MODO || 'instagram' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
        run: python -m src.cli escuchar

      - name: Guardar el estado en el repositorio
        # Aunque el paso anterior falle: el offset de Telegram pudo avanzar y si
        # no se guarda, la misma orden se atenderia otra vez y publicaria dos veces.
        if: always()
        run: |
          git config user.name "pomniii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Nada que guardar."
          else
            git commit -m "orden atendida [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=Fallo al atender tu orden. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
