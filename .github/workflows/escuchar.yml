name: Escuchar al bot

# Atiende las ordenes que le mandas al bot de Telegram:
#
#   /post     publica ahora el siguiente texto
#   /probar   te manda la tarjeta sin publicar nada
#   /saltar   descarta el siguiente sin publicarlo
#   /estado   cuantos textos quedan
#
# Una pasada corta cada 5 minutos, que es el intervalo minimo del cron de GitHub.
# Entre que mandas la orden y que se atiende pueden pasar de 5 a 20 minutos
# (Actions retrasa las tareas programadas cuando hay carga), y eso esta aceptado:
# el post no tiene prisa.
#
# Ninguna orden se pierde por esperar: Telegram las guarda en una cola hasta que
# alguien las recoge, asi que da igual que no haya nadie escuchando en el momento
# exacto en que tocas el boton.
#
# Se descarto quedarse escuchando en bucle con long polling (respuesta en
# segundos) porque eso deja el trabajo corriendo casi todo el rato, y eso se
# parece a usar Actions como un servidor. Si algun dia hace falta respuesta
# instantanea, la via correcta es un webhook de Telegram contra un Cloudflare
# Worker gratuito que dispare este workflow.

# CRON DESACTIVADO: se usa el webhook (orden.yml + cloudflare/worker.js), que
# responde en segundos en vez de sondear cada 5 minutos.
#
# Los dos modos son EXCLUYENTES: con webhook activo, Telegram deja de encolar
# las ordenes para getUpdates y este workflow no recibiria nada, ademas de
# fallar con un 409. Para volver al sondeo hay que quitar antes el webhook:
#
#   python -m herramientas.configurar_webhook --quitar
#
# ...y descomentar el cron de abajo.

on:
  # schedule:
  #   - cron: "*/5 * * * *"
  workflow_dispatch:

# El mismo grupo que la publicacion diaria: los dos escriben en data/ y si
# coinciden se pisan el estado.
concurrency:
  group: pomniii-estado
  cancel-in-progress: false

jobs:
  escuchar:
    runs-on: ubuntu-latest
    # Red de seguridad: si algo se quedara colgado, el trabajo muere solo en vez
    # de comerse minutos indefinidamente.
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atender las ordenes
        env:
          IG_MODO: ${{ vars.IG_MODO || 'instagram' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          # Sin estas dos, la tarjeta se cuelga en imgbb y a Instagram se le
          # agota el tiempo al descargarla. GITHUB_REPOSITORY ya viene puesta.
          HOSTING: ${{ vars.HOSTING || 'github' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m src.cli escuchar

      - name: Guardar el estado en el repositorio
        # Aunque el paso anterior falle: el offset de Telegram pudo avanzar y si
        # no se guarda, la misma orden se atenderia otra vez y publicaria dos veces.
        if: always()
        run: |
          git config user.name "pomniii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Nada que guardar."
          else
            git commit -m "orden atendida [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=Fallo al atender tu orden. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
