name: Escuchar al bot

# Atiende las ordenes que le mandas al bot de Telegram:
#
#   /post     publica ahora el siguiente texto
#   /probar   te manda la tarjeta sin publicar nada
#   /saltar   descarta el siguiente sin publicarlo
#   /estado   cuantos textos quedan
#
# El cron de GitHub no baja de 5 minutos: esta documentado y no hay forma de
# saltarselo. Para que la respuesta no tarde 5 minutos, cada ejecucion no da una
# sola pasada, sino que se queda escuchando 4 minutos con long polling: Telegram
# mantiene la peticion abierta y contesta en el INSTANTE en que escribes la
# orden. Asi la respuesta es de segundos casi siempre, y en el peor caso (si la
# orden cae en el hueco entre dos ejecuciones) esperas lo que tarde la siguiente.
#
# Ninguna orden se pierde: Telegram las guarda en una cola hasta que alguien las
# recoge.
#
# Esto tiene una contrapartida honesta: el trabajo esta corriendo casi todo el
# rato, y eso se parece a usar Actions como un servidor, algo que las condiciones
# de GitHub no contemplan. En un repositorio publico los minutos son ilimitados y
# gratis, pero si quieres estar del lado seguro, quita el --bucle y acepta los
# 5 minutos de espera. La alternativa correcta para respuesta instantanea es un
# webhook de Telegram apuntando a un Cloudflare Worker gratuito que dispare el
# workflow, y entonces esto no haria falta.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# El mismo grupo que la publicacion diaria: los dos escriben en data/ y si
# coinciden se pisan el estado.
concurrency:
  group: pomniii-estado
  cancel-in-progress: false

jobs:
  escuchar:
    runs-on: ubuntu-latest
    # Red de seguridad: si algo se quedara colgado, el trabajo muere solo en vez
    # de comerse minutos indefinidamente.
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Atender las ordenes
        env:
          IG_MODO: ${{ vars.IG_MODO || 'instagram' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
        # 4 minutos de escucha con el cron cada 5: cobertura casi continua.
        # --espera 50 es el maximo de long polling que admite Telegram.
        run: python -m src.cli escuchar --bucle 4 --espera 50

      - name: Guardar el estado en el repositorio
        # Aunque el paso anterior falle: el offset de Telegram pudo avanzar y si
        # no se guarda, la misma orden se atenderia otra vez y publicaria dos veces.
        if: always()
        run: |
          git config user.name "pomniii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Nada que guardar."
          else
            git commit -m "orden atendida [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=Fallo al atender tu orden. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
