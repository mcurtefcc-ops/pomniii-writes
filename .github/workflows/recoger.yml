name: Recoger respuesta

# Mira si has pulsado algun boton en Telegram y actua: publica en Instagram,
# salta el texto o propone otro.
#
# Va cada 20 minutos en vez de quedarse esperando porque GitHub factura por
# minuto de ejecucion: un job esperando tu respuesta 8 horas gastaria 480
# minutos al dia. Asi son unos 35 segundos por pasada.
#
# Cada ejecucion de cron cuenta minutos: en repositorios publicos son
# ilimitados y gratis, en privados hay 2.000 al mes en el plan Free. Con esta
# frecuencia se gastan unos 1.200, asi que si el repositorio es privado y vas
# justo, sube el intervalo a */30.

# DESACTIVADO: el proyecto esta en modo automatico, asi que no hay botones que
# leer y este workflow no tiene nada que hacer. Se deja aqui, sin cron, para
# poder volver al modo con aprobacion sin reescribirlo: descomenta el cron de
# abajo y cambia el comando de proponer.yml por "proponer --respetar-hora".

on:
  # schedule:
  #   - cron: "*/20 6-22 * * *"
  workflow_dispatch:

concurrency:
  group: pomniii-estado
  cancel-in-progress: false

jobs:
  recoger:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leer los botones pulsados
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
        run: python -m src.cli recoger

      - name: Guardar el estado en el repositorio
        # Se ejecuta aunque el paso anterior falle: si la publicacion en
        # Instagram fallo pero el offset de Telegram ya avanzo, hay que
        # guardarlo igual para no procesar dos veces la misma pulsacion.
        if: always()
        run: |
          git config user.name "pomniii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Nada que guardar."
          else
            git commit -m "respuesta recogida [skip ci]"
            git pull --rebase --autostash
            git push
          fi
