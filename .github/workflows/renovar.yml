name: Renovar el token de Instagram

# El token de Instagram Login caduca a los 60 dias. Este workflow lo renueva el
# dia 1 de cada mes y guarda el valor nuevo en el secret del repositorio, para
# que la publicacion diaria siga funcionando sin que tengas que tocar nada.
#
# Va mensual y no cada 55 dias porque el cron de GitHub no sabe contar dias
# sueltos: mejor renovar de sobra que apurar y quedarse fuera.
#
# Requisito unico: un secret GH_PAT con un token personal fino que tenga
# permiso "Secrets: read and write" sobre este repositorio. Sin el, la
# renovacion funciona pero no puede guardar el valor nuevo, y avisa por Telegram.

on:
  schedule:
    - cron: "0 5 1 * *" # dia 1 de cada mes, 05:00 UTC
  workflow_dispatch:

concurrency:
  group: pomniii-token
  cancel-in-progress: false

jobs:
  renovar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Renovar y guardar
        env:
          IG_MODO: ${{ vars.IG_MODO || 'instagram' }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: python -m herramientas.renovar_token
