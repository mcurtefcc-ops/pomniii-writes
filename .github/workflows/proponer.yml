name: Propuesta diaria

# A las 00:00 de Espana te manda por Telegram el siguiente poema con dos
# botones: Si (se publica en Instagram) o No (te propone el siguiente). Si
# prefieres escribir tu algo, se lo mandas al bot tal cual y te ensena tu
# tarjeta con los mismos botones. No publica nada sin tu Si; las respuestas
# las atiende orden.yml.

on:
  schedule:
    # El cron de Actions solo entiende UTC y no ajusta el horario de verano,
    # asi que se lanza a las dos horas posibles y el guardian de
    # "--respetar-hora" (config.json -> programacion) deja pasar solo la que
    # cae entre las 00:00 y las 02:00 de Madrid. Si caen las dos (verano), la
    # segunda ve que ya hay propuesta de hoy y no repite.
    # GitHub a veces arranca los cron con 10-30 min de retraso.
    - cron: "0 22 * * *" # 00:00 en verano (CEST, UTC+2)
    - cron: "0 23 * * *" # 00:00 en invierno (CET, UTC+1)
  workflow_dispatch:
    inputs:
      forzar:
        description: "Proponer ahora aunque ya haya propuesta o post hoy"
        type: boolean
        default: false

# Un solo workflow tocando el estado a la vez.
concurrency:
  group: pomniii-estado
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Proponer el poema del dia
        env:
          IG_MODO: ${{ vars.IG_MODO || 'instagram' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GRAPH_VERSION: ${{ vars.GRAPH_VERSION || 'v23.0' }}
          # Sin estas dos, la tarjeta se cuelga en imgbb y a Instagram se le
          # agota el tiempo al descargarla. GITHUB_REPOSITORY ya viene puesta.
          HOSTING: ${{ vars.HOSTING || 'github' }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          # Lanzado a mano se propone al momento; programado se respeta la hora.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python -m src.cli proponer --respetar-hora
          else
            python -m src.cli proponer ${{ inputs.forzar && '--forzar' || '' }}
          fi

      - name: Guardar el estado en el repositorio
        # Se ejecuta aunque el paso anterior falle: si el post salio pero algo
        # posterior se rompio, el registro tiene que quedar guardado igual o
        # manana se republicaria el mismo texto.
        if: always()
        run: |
          git config user.name "pomniii-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then
            echo "Nada que guardar."
          else
            git commit -m "propuesta del dia [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: Avisar por Telegram si algo ha fallado
        if: failure()
        env:
          TG: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TG}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=No pude preparar la propuesta de hoy. Detalle: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
