<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salón de juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Playfair+Display:ital,wght@0,700;1,600&display=swap" rel="stylesheet">
<style>
  /* Salón oscuro de madera y latón: pensado para verse de lejos en una tele. */
  :root {
    color-scheme: dark;
    --fondo: #0d0a12;
    --fondo2: #1d1527;
    --texto: #f6efe2;
    --suave: #a79db3;
    --oro: #e8b85c;
    --oro2: #ffd98a;
    --panel: rgba(255,255,255,.05);
    --borde: rgba(255,255,255,.1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: Barlow, system-ui, sans-serif; color: var(--texto); font-size: 2.2vh;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(232,184,92,.13), transparent 55%),
      radial-gradient(ellipse at 95% 100%, rgba(226,85,75,.10), transparent 50%),
      linear-gradient(160deg, var(--fondo2), var(--fondo));
  }
  h1, h2 { font-family: "Playfair Display", Georgia, serif; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .pantalla { position: fixed; inset: 0; display: none; }
  .pantalla.activa { display: block; }

  [data-nav] { transition: transform .15s, border-color .15s, background .15s, box-shadow .15s; outline: none; }
  [data-nav]:focus {
    border-color: var(--oro) !important; background: rgba(232,184,92,.15);
    box-shadow: 0 0 0 .5vh rgba(232,184,92,.28), 0 1vh 4vh rgba(0,0,0,.45); transform: scale(1.045);
  }

  /* ---------- Inicio ---------- */
  #inicio { overflow-y: auto; padding: 4vh 4vw 10vh; scroll-behavior: smooth; }
  .cabecera { display: flex; align-items: center; justify-content: space-between; gap: 3vw; margin-bottom: 3vh; }
  .cabecera h1 { font-size: 8vh; line-height: 1; text-shadow: 0 .6vh 3vh rgba(0,0,0,.5); }
  .cabecera h1 em { color: var(--oro); font-style: italic; }
  .cabecera .lema { color: var(--suave); font-size: 2.4vh; margin-top: 1.2vh; }
  #conexion { display: flex; gap: 2vw; align-items: center; padding: 1.6vh 1.6vw; border-radius: 2vh; background: var(--panel); border: 2px solid var(--borde); }
  #conexion.ok { border-color: rgba(95,211,141,.45); }
  #qr { width: 15vh; height: 15vh; background: #fff; border-radius: 1.2vh; padding: .8vh; flex: none; }
  #qr svg { width: 100%; height: 100%; display: block; }
  #conexion .titulo { font-size: 2.2vh; color: var(--suave); }
  #conexion .codigo { font-size: 6vh; font-weight: 700; letter-spacing: .25em; color: var(--oro2); line-height: 1.1; }
  #conexion .estado { font-size: 2vh; }
  #conexion .nombres { font-size: 1.8vh; color: var(--suave); max-width: 22vw; }
  #urlMando { font-size: 1.6vh; color: var(--suave); }

  .categoria { margin-top: 3.5vh; }
  .categoria h2 { font-size: 3.6vh; margin-bottom: 1.6vh; color: var(--oro2); }
  .rejilla { display: grid; grid-template-columns: repeat(6, 1fr); gap: 1.8vh 1.4vw; }
  .tarjeta {
    display: flex; flex-direction: column; align-items: flex-start; gap: .6vh; text-align: left;
    padding: 2vh 1.4vw; min-height: 19vh; border-radius: 1.8vh; background: var(--panel); border: 2px solid var(--borde);
  }
  .tarjeta .icono { font-size: 6vh; line-height: 1.1; filter: drop-shadow(0 .6vh 1.2vh rgba(0,0,0,.5)); }
  .tarjeta .nombre { font-family: "Playfair Display", serif; font-size: 3vh; font-weight: 700; line-height: 1.1; }
  .tarjeta .info { color: var(--suave); font-size: 1.8vh; margin-top: auto; }
  .pie { margin-top: 5vh; text-align: center; color: var(--suave); font-size: 1.9vh; }
  .pie button { margin-left: 1vw; padding: .6vh 1.4vw; border-radius: 99px; background: var(--panel); border: 2px solid var(--borde); }

  /* ---------- Clasificación ---------- */
  #ranking { overflow-y: auto; padding: 4vh 4vw 8vh; }
  #ranking h1 { font-size: 7vh; }
  .cabRanking, .filaRanking { display: grid; grid-template-columns: 7vw 1.6fr 1fr 1fr 1fr 1.6fr 1.6fr; align-items: center; gap: 1vw; padding: 1.4vh 1.6vw; }
  .cabRanking { color: var(--suave); font-size: 1.9vh; text-transform: uppercase; letter-spacing: .08em; margin-top: 2vh; }
  .filaRanking { background: var(--panel); border: 2px solid var(--borde); border-radius: 1.4vh; margin-top: 1vh; font-size: 2.6vh; }
  .filaRanking:first-child { border-color: var(--oro); background: rgba(232,184,92,.12); }
  .filaRanking .pos { font-size: 3.4vh; font-family: "Playfair Display", serif; }
  .filaRanking .nom { font-weight: 700; }
  .filaRanking .num { font-variant-numeric: tabular-nums; }
  .filaRanking .fav { color: var(--suave); font-size: 2.1vh; }
  .vacio { color: var(--suave); font-size: 2.6vh; margin-top: 3vh; }
  .tituloLogros { font-size: 4vh; margin: 5vh 0 2vh; color: var(--oro2); }
  #listaLogros { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vh 1.4vw; }
  .logro { display: flex; gap: 1.2vw; align-items: center; padding: 1.6vh 1.4vw; border-radius: 1.4vh; background: var(--panel); border: 2px solid var(--borde); opacity: .5; font-size: 2.2vh; }
  .logro.conseguido { opacity: 1; border-color: rgba(232,184,92,.5); }
  .logro .ic { font-size: 4.6vh; }
  .logro small { color: var(--suave); font-size: 1.8vh; }

  /* ---------- Configuración ---------- */
  #config { display: none; }
  #config.activa { display: flex; align-items: center; justify-content: center; gap: 6vw; padding: 0 6vw; }
  .ficha-juego { width: 32vw; }
  #cfgIcono { font-size: 16vh; line-height: 1; filter: drop-shadow(0 1vh 2vh rgba(0,0,0,.5)); }
  #cfgNombre { font-size: 8vh; margin: 2vh 0 1vh; }
  #cfgDesc { color: var(--suave); font-size: 2.8vh; line-height: 1.4; }
  #cfgNota { margin-top: 3vh; color: var(--oro2); font-size: 2.2vh; line-height: 1.4; }
  #cfgOpciones { width: 46vw; display: flex; flex-direction: column; gap: 1.4vh; max-height: 90vh; overflow-y: auto; padding: 1vh 1vw; }
  .opcion { display: flex; justify-content: space-between; align-items: center; gap: 2vw; padding: 1.7vh 2.2vw; border-radius: 1.4vh; background: var(--panel); border: 2px solid var(--borde); font-size: 2.6vh; }
  .opcion .valor { color: var(--oro2); font-weight: 700; white-space: nowrap; }
  .opcion .valor::before { content: "◀  "; opacity: .45; font-size: .75em; }
  .opcion .valor::after { content: "  ▶"; opacity: .45; font-size: .75em; }
  .opcion.slot .etq { display: flex; align-items: center; gap: 1vw; }
  .opcion.slot .etq::before { content: ""; width: 2.6vh; height: 2.6vh; border-radius: 50%; background: var(--color); box-shadow: inset 0 -.4vh .6vh rgba(0,0,0,.35); }
  .principal { margin-top: 1.4vh; padding: 2vh; border-radius: 1.4vh; border: 2px solid transparent; background: linear-gradient(180deg, var(--oro2), var(--oro)); color: #2a1a05; font-weight: 700; font-size: 3.2vh; }
  .principal:focus { background: linear-gradient(180deg, #fff1c9, var(--oro2)); }
  .secundario { padding: 1.8vh 2.4vw; border-radius: 1.4vh; background: var(--panel); border: 2px solid var(--borde); font-size: 2.6vh; }

  /* ---------- Juego ---------- */
  #juego.activa { display: flex; align-items: center; justify-content: center; background: #000; }
  #lienzo { display: block; }

  /* ---------- Diálogo ---------- */
  #velo { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(8,6,12,.72); z-index: 20; }
  #velo.activo { display: flex; }
  .caja { text-align: center; padding: 5vh 5vw; border-radius: 2.4vh; background: linear-gradient(160deg, #2a2034, #15101b); border: 2px solid rgba(232,184,92,.4); box-shadow: 0 4vh 10vh rgba(0,0,0,.6); animation: entra .45s cubic-bezier(.2,1.4,.4,1); max-width: 80vw; }
  @keyframes entra { from { transform: scale(.85); opacity: 0; } }
  #dIcono { font-size: 10vh; line-height: 1.1; }
  #dTitulo { font-size: 6vh; margin: 1vh 0; }
  #dTexto { color: var(--suave); font-size: 2.6vh; margin-bottom: 4vh; white-space: pre-line; }
  #dBotones { display: flex; gap: 1.6vw; justify-content: center; }
  #dBotones button { min-width: 16vw; margin: 0; }

  #aviso { position: fixed; bottom: 8vh; left: 50%; transform: translate(-50%, 3vh); padding: 1.4vh 2.6vw; border-radius: 99px; background: rgba(20,15,26,.92); border: 2px solid rgba(232,184,92,.5); font-size: 2.4vh; opacity: 0; transition: opacity .3s, transform .3s; z-index: 40; pointer-events: none; }
  #aviso.visible { opacity: 1; transform: translate(-50%, 0); }
  #confeti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<section class="pantalla" id="inicio">
  <div class="cabecera">
    <div>
      <h1>Salón de <em>juegos</em></h1>
      <div class="lema">Elige con el mando o con el móvil</div>
    </div>
    <div id="conexion">
      <div id="qr"></div>
      <div>
        <div class="titulo">Usa el móvil como mando · código</div>
        <div class="codigo">----</div>
        <div class="estado">Conectando…</div>
        <div class="nombres"></div>
        <div id="urlMando"></div>
      </div>
    </div>
  </div>
  <div id="listaJuegos"></div>
  <div class="pie">◀ ▲ ▼ ▶ moverte · OK elegir · Atrás volver <button data-nav id="verRanking">🏆 Clasificación y logros</button> <button data-nav id="pantallaCompleta">Pantalla completa</button></div>
</section>

<section class="pantalla" id="ranking">
  <div class="cabecera"><div><h1>Clasificación</h1><div class="lema">Cada persona cuenta por el nombre de su móvil · «Tú» es el mando de la tele</div></div>
  <button class="secundario" data-nav id="volverRanking">◀ Volver</button></div>
  <div class="cabRanking"><span></span><span>Jugador</span><span>Victorias</span><span>Partidas</span><span>Ganadas</span><span>Su juego</span><span>Logros</span></div>
  <div id="tablaRanking"></div>
  <h2 class="tituloLogros">Logros</h2>
  <div id="listaLogros"></div>
</section>

<section class="pantalla" id="config">
  <div class="ficha-juego">
    <div id="cfgIcono"></div>
    <h1 id="cfgNombre"></h1>
    <p id="cfgDesc"></p>
    <p id="cfgNota"></p>
  </div>
  <div id="cfgOpciones"></div>
</section>

<section class="pantalla" id="juego">
  <canvas id="lienzo"></canvas>
</section>

<div id="velo"><div class="caja"><div id="dIcono"></div><h2 id="dTitulo"></h2><p id="dTexto"></p><div id="dBotones"></div></div></div>
<div id="aviso"></div>
<canvas id="confeti"></canvas>

<script src="qrcode.js"></script>
<script src="motor.js?v=1"></script>
<script src="catalogo.js?v=1"></script>
<script>Salon.arrancar();</script>
</body>
</html>
